name: daily-arxiv

on:
  schedule:
    # Primary: 03:31 UTC (~09:01 IST), weekdays. arXiv announces at 00:00 UTC
    # (01:00 UTC in winter) and its feeds settle within ~1-2h, so this has a
    # safe margin year-round while still landing before a 9am read.
    - cron: "31 3 * * 1-5"
    # Backup: 07:23 UTC (~12:53 IST). Covers a primary run that GitHub delayed
    # past the feed or dropped entirely. fetch_arxiv is idempotent -- if the
    # primary already wrote data/raw/<date>.json this run just rebuilds from it.
    - cron: "23 7 * * 1-5"
  workflow_dispatch:
  # External punctual trigger. GitHub's own `schedule` is best-effort and has
  # been dropping this repo's runs, so an off-platform scheduler (cron-job.org)
  # POSTs to the repo `dispatches` API each weekday morning:
  #   curl -X POST -H "Authorization: Bearer <fine-grained PAT, Contents: write>" \
  #        -H "Accept: application/vnd.github+json" \
  #        https://api.github.com/repos/manns01/arXivly-atlas/dispatches \
  #        -d '{"event_type":"daily-arxiv"}'
  # The schedule crons above stay as a fallback.
  repository_dispatch:
    types: [daily-arxiv]

# Don't let a slow run overlap the next one and race the git push.
concurrency:
  group: daily-arxiv
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit the day's data/raw/<date>.json back to main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # fetch -> atlas -> generate. Non-zero exit fails the job and nothing
      # deploys, so the previously published site stays up.
      - run: python build.py

      - name: Commit new raw data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No new raw data to commit."
          else
            git commit -m "data: arXiv announcements $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
