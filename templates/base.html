<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  {% if canonical and site.base_url %}<link rel="canonical" href="{{ site.base_url }}{{ canonical }}">{% endif %}
  <link rel="icon" href="{{ rel }}assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="{{ rel }}assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ rel }}index.html">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ rel }}index.html">Today</a>
      <a href="{{ rel }}archive/index.html">Archive</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>Generated {{ generated_at }} UTC</span>
    <span>·</span>
    <a href="https://arxiv.org/">arXiv.org</a>
    <span>·</span>
    {% if site.repo_url %}<a href="{{ site.repo_url }}">built with arXivly-atlas</a>
    <span>·</span>{% endif %}
    <span>© 2026 Manish Tamta</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
