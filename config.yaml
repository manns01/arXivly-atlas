# arXivly-atlas configuration. Everything here is safe to edit by hand.
# See README for matching semantics. Values marked "measured" have starting
# points from the 2026-09-07 planning measurement; retune after the rolling
# window has real depth.

# Whole archives, not sub-categories -- "astro-ph" pulls the entire astro feed,
# so any astro/hep bulletin you type into the site's filter box already has data
# behind it. Add or remove archives here; the daily job picks it up on its next
# run. Sub-categories (astro-ph.CO) also work if you want a narrow fetch.
categories: [astro-ph, gr-qc, hep-ph]
announce_types: [new, cross]        # drop replace / replace-cross (~44% of a feed)

# "all"      -> keep every new/cross paper in the categories above; `keywords`
#               and `authors` only rank (scoring), seed the filter UI, and feed
#               the TF-IDF stop-list. Best with a broad `categories` net.
# "keywords" -> a paper must match a keyword or a priority author to appear at all.
filter_mode: all

keywords:                            # plain case-insensitive substring on title+abstract
                                     # under filter_mode: all these only rank + seed the UI fields
  # lensing / GW / dark matter (original set)
  - gravitational lensing
  - wave optics
  - microlensing
  - caustic crossing
  - weak lensing
  - gravitational waves
  - dark matter
  - ultralight dark matter
  - fuzzy dark matter
  - self-interacting dark matter
  - cosmology
  - stochastic gravitational waves
  - supermassive black holes
  # observational cosmology -- facilities & surveys
  # NOTE: 'Euclid ' / 'DESI ' keep the trailing space (quoted) on purpose:
  # bare "Euclid" hits "Euclidean", bare "DESI" hits "design/desire/desired".
  - JWST
  - James Webb
  - Roman Space Telescope
  - Nancy Grace Roman
  - 'Euclid '
  - Vera Rubin
  - Rubin Observatory
  - LSST
  - Extremely Large Telescope
  - Square Kilometre Array
  - Simons Observatory
  - CMB-S4
  - 'DESI '
  - Dark Energy Spectroscopic Instrument
  - Dark Energy Survey
  - KiDS
  - Hyper Suprime-Cam
  # dark energy & cosmological tensions (data-driven, not hard-core theory)
  - dark energy
  - evolving dark energy
  - dynamical dark energy
  - dark energy equation of state
  - w0waCDM
  - w0wa
  - quintessence
  - Hubble tension
  - Hubble constant
  - H0 tension
  - S8 tension
  - sigma8
  - cosmological tensions
  # distance ladder / SN cosmology
  - distance ladder
  - Cepheid
  - Type Ia supernova
  - SH0ES
  - TRGB
  - standard siren
  - time-delay cosmography
  # large-scale structure & lensing probes
  - baryon acoustic oscillation
  - large-scale structure
  - redshift-space distortion
  - cosmic shear
  - weak-lensing shear
  - intrinsic alignment
  - 3x2pt
  - CMB lensing
  - growth of structure
  - reionization
  - cosmic dawn
  - little red dots
  - high-redshift galaxies
  # ML in astro/cosmo (also drives the `spotlight` section below)
  - machine learning
  - deep learning
  - neural network
  - convolutional neural network
  - graph neural network
  - transformer
  - normalizing flow
  - simulation-based inference
  - likelihood-free inference
  - neural posterior estimation
  - emulator
  - Gaussian process
  - physics-informed neural network
  - diffusion model
  - foundation model
  - self-supervised
  - anomaly detection

# Dropped on a single substring hit anywhere in title+abstract, regardless of
# filter_mode. Aimed at hep-ph collider-experiment noise. Trimming lines softens
# it (e.g. "collider"/"LHC" also drop DM papers that only mention colliders).
exclude_keywords:
  - Large Hadron Collider
  - LHC
  - collider
  - hadron collider
  - parton distribution
  - parton shower
  - jet substructure

# Always-on, keyword-defined sections rendered above the auto clusters. Each
# paper whose title+abstract contains any `match` term (case-insensitive
# substring) is listed; it also still appears in its normal cluster below.
spotlight:
  - label: "ML in cosmology & astro"
    match: [machine learning, deep learning, neural network, normalizing flow,
            simulation-based inference, likelihood-free inference, emulator,
            graph neural network, transformer, diffusion model, foundation model,
            physics-informed neural network, neural posterior estimation]

# Priority authors -- a small ranking bonus (`scoring.author_bonus`) and a ★
# badge whenever one appears on a paper. Matched on the LaTeX/Unicode-normalized
# surname, exactly (never a substring). Two forms:
#   - bare surname        -> "Suyu"      matches any first name
#   - initial + surname   -> "L. Dai"    first initial must also match
# Use the initial form for common surnames. Replace these with the people whose
# work you want floated to the top; leave the list empty to disable.
authors:
  - Suyu
  - L. Dai            # Liang Dai -- example of the "initial + surname" form

scoring:
  title_weight: 3
  abstract_weight: 1
  author_bonus: 5

similarity:
  method: tfidf                      # seam for swapping in embeddings later
  knn: 4                             # visual edges: mutual k-NN ...
  edge_threshold: 0.08              # ... AND cosine >= this (measured: max pair ~0.23)
  distance_threshold: 0.92          # clusters: agglomerative cut on 1 - cosine
  min_cluster_size: 2               # smaller clusters fall into "Unclustered"
  # add config.keywords to the TF-IDF stop-list. Left unset it follows
  # filter_mode: on for "keywords" (they saturate that corpus), off for "all"
  # (they are discriminative there). Set true/false to override.
  # stoplist_keywords: false

atlas:
  window_days: 5                    # broad net -> short window; 5d x ~160/day
  max_window_papers: 400            # hard cap on the window corpus; today's papers are never dropped

site:
  title: arXivly-atlas
  base_url: /arXivly-atlas           # "" for a user/organization site or custom domain
  repo_url: "https://github.com/manns01/arXivly-atlas"   # used by the "unknown category" hint
  match_chars: 800                   # chars of abstract embedded per paper for in-browser filtering
  max_papers_per_day: 200            # >= typical daily volume, so today is never truncated
